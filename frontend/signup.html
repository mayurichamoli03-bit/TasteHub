<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration — TasteHub Food Ordering</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
</head>
<body>


  <header class="header">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🍲</span>
        <span>Taste<span class="accent">Hub</span></span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="orders.html" class="nav-link">My Orders</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-btn-link" title="Shopping Cart">
          <span>🛒</span>
          <span class="cart-text">Cart</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>

        <div id="nav-auth-container" class="nav-auth-wrap">
          <a href="login.html" class="nav-link auth-link">Login</a>
          <a href="signup.html" class="btn btn-primary btn-sm active">Sign Up</a>
        </div>

        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation menu">
          ☰
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <div class="auth-wrapper">
        <div class="auth-header">
          <span style="font-size: 2.2rem; display: block; margin-bottom: 8px;">🎉</span>
          <h2>Create Your Account</h2>
          <p>Join TasteHub to enjoy fast, fresh food delivered to your door</p>
        </div>

  
        <div id="auth-alert" class="alert" style="display: none;"></div>

       
        <form id="signup-form">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input 
              type="text" 
              id="signup-name" 
              class="form-control" 
              placeholder="e.g. Rahul Sharma" 
              required 
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <input 
              type="email" 
              id="signup-email" 
              class="form-control" 
              placeholder="e.g. rahul@example.com" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password (minimum 6 characters)</label>
            <input 
              type="password" 
              id="signup-password" 
              class="form-control" 
              placeholder="Create a secure password" 
              required 
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <input 
              type="password" 
              id="signup-confirm-password" 
              class="form-control" 
              placeholder="Repeat your password" 
              required 
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <button type="submit" id="signup-submit-btn" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
            Create Account
          </button>
        </form>

        <div class="auth-footer-text">
          Already registered? <a href="login.html">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

 
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>© 2026 TasteHub. All rights reserved.</p>
      </div>
    </div>
  </footer>


  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
