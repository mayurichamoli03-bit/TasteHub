<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — TasteHub Food Ordering</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
</head>
<body>


  <header class="header">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🍲</span>
        <span>Taste<span class="accent">Hub</span></span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="orders.html" class="nav-link">My Orders</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-btn-link" title="Shopping Cart">
          <span>🛒</span>
          <span class="cart-text">Cart</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>

        <div id="nav-auth-container" class="nav-auth-wrap">
          <a href="login.html" class="nav-link auth-link active">Login</a>
          <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>

        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation menu">
          ☰
        </button>
      </div>
    </div>
  </header>


  <main class="main-content">
    <div class="container">

      <div class="auth-wrapper">
        <div class="auth-header">
          <span style="font-size: 2.2rem; display: block; margin-bottom: 8px;">👋</span>
          <h2>Welcome Back</h2>
          <p>Sign in to your TasteHub account to place and track orders</p>
        </div>

        <div id="auth-alert" class="alert" style="display: none;"></div>

       
        <div id="already-logged-in-notice" class="alert alert-info" style="display: none;">
          You are currently signed in as <strong id="logged-in-user-name">User</strong>.
          <div style="margin-top: 8px;">
            <a href="menu.html" class="btn btn-primary btn-sm">Order Food</a>
            <a href="orders.html" class="btn btn-outline btn-sm" style="margin-left: 8px;">View Orders</a>
          </div>
        </div>

    
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input 
              type="email" 
              id="login-email" 
              class="form-control" 
              placeholder="e.g. rahul@example.com" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="Enter your account password" 
              required 
              autocomplete="current-password"
            />
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
            Sign In
          </button>
        </form>

        <div class="auth-footer-text">
          Don't have an account yet? <a href="signup.html">Create one here</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>© 2026 TasteHub. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
